<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>granny</title>
</head>
<body style="font:15px -apple-system, system-ui; padding: 20px; min-width: 360px;">
  <h2>granny</h2>
  <p>Port and token must match <code>~/.config/granny/config.json</code><br>
     (granny's menu bar menu → Open config).</p>
  <label>Port <input id="port" type="number" value="47899"></label><br><br>
  <label>Token <input id="token" type="password" size="40"></label><br><br>
  <button id="save">Save</button>
  <span id="status" style="margin-left: 8px; color: #2a7;"></span>
  <script src="options.js"></script>
</body>
</html>
