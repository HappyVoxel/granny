name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank: compute from the commits)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Unit tests
        working-directory: GrannyAgent
        run: swift test

      - name: E2E suites (no sudo, no network)
        run: |
          scripts/proto.sh self-test
          bash tests/e2e.sh
          bash tests/e2e-helper.sh
          bash tests/e2e-agent.sh
          bash tests/e2e-extension.sh
          bash tests/e2e-safari.sh

  release:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(bash scripts/next-version.sh)"
          fi
          if [ -z "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The literals travel with the artifacts only; master stays untouched
      # (the ruleset requires a pull request for it). Local builds fall back
      # to `git describe`, so the repo never reports a stale version.
      - name: Sync version literals
        if: steps.version.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i '' -E "s/(GRANNY_VERSION:-)[0-9][0-9.]*/\1$VERSION/" \
            scripts/build-app.sh scripts/build-release.sh
          sed -i '' -E "s/(\"version\": \")[0-9][0-9.]*/\1$VERSION/" \
            extension/chrome/manifest.json extension/safari/manifest.json
          sed -i '' -E "s/(\"name\": \"granny-agent\", \"version\": \")[0-9][0-9.]*/\1$VERSION/" \
            GrannyAgent/Sources/GrannyCore/TraceClient.swift
          sed -i '' -E "s/^  version \".*\"$/  version \"$VERSION\"/" \
            packaging/homebrew/Casks/granny.rb

      - name: Build release archive
        if: steps.version.outputs.skip == 'false'
        env:
          GRANNY_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/release/granny-${{ steps.version.outputs.version }}.zip" \
            "dist/release/granny-${{ steps.version.outputs.version }}.zip.sha256" \
            --target "$(git rev-parse HEAD)" \
            --title "granny v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Update the Homebrew tap
        if: steps.version.outputs.skip == 'false'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping tap update."
            echo "The cask in packaging/homebrew/Casks/granny.rb still points at the old version."
            exit 0
          fi
          SHA="$(cat "dist/release/granny-$VERSION.zip.sha256")"
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" \
            packaging/homebrew/Casks/granny.rb

          git clone "https://x-access-token:$TAP_TOKEN@github.com/HappyVoxel/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cp packaging/homebrew/Casks/granny.rb tap-repo/Casks/granny.rb
          cd tap-repo
          git config user.name "Binh Duc Nguyen"
          git config user.email "114677249+tripplen23@users.noreply.github.com"
          git add Casks/granny.rb
          git commit -m "granny $VERSION"
          git push
